# Grafana dashboard provisioning for FirmScout.
#
# A file provider pointing at infrastructure/observability/grafana/dashboards/
# (mounted read-only into the Grafana container at
# /var/lib/grafana/dashboards -- see the `grafana` service's volumes in
# infrastructure/docker/docker-compose.yml). Grafana loads every *.json file
# in that directory as a dashboard on container start and re-scans it
# periodically (updateIntervalSeconds below), so editing the committed JSON
# and restarting/waiting is how a dashboard changes -- never the in-app
# editor, per grafana-dashboards.md's "Dashboards are version-controlled,
# not edited in the UI" rule.
#
# `allowUiUpdates: false` enforces that rule at the tool level: an
# in-Grafana edit to a provisioned dashboard is rejected rather than
# silently accepted and then lost on the next container restart.

apiVersion: 1

providers:
  - name: firmscout
    orgId: 1
    folder: "FirmScout"
    type: file
    disableDeletion: false
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
