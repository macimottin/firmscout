name: Registry Schemas

# The Git-managed registry (dataset/ and collectors/config/) is the half of FirmScout's
# data that humans write by hand, so it is the half that needs a fast, readable failure.
#
# This runs scripts/check-schemas.py, the same script contributors run locally via
# `make schemas`. Using one tool in both places means a green CI and a green laptop mean
# the same thing. It also handles multi-document YAML, which the category vocabulary
# uses and which check-jsonschema's CLI does not expand globs for.

on:
  push:
    branches: [main, develop]
    paths:
      - 'dataset/**'
      - 'collectors/config/**'
      - 'packages/schemas/**'
      - 'scripts/check-schemas.py'
      - '.github/workflows/schemas.yml'
  pull_request:
    paths:
      - 'dataset/**'
      - 'collectors/config/**'
      - 'packages/schemas/**'
      - 'scripts/check-schemas.py'
      - '.github/workflows/schemas.yml'

permissions:
  contents: read

jobs:
  schemas:
    name: Validate the registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install validation dependencies
        run: pip install --disable-pip-version-check jsonschema PyYAML

      - name: Validate every registry document
        run: python3 scripts/check-schemas.py

      - name: Cross-check the registry against the Go loader
        # The schemas give a contributor a readable error; the Go loader is the
        # authority on what a valid document actually means. Running both catches the
        # case where they have drifted apart, which is the failure mode a schema
        # alone cannot detect.
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'

      - name: Load the registry with the production parser
        run: go test ./internal/adapters/registry/... -count=1
