name: Security

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

# Least privilege by default. Two jobs need more and say so individually, which is
# also what makes it obvious in review when a third one starts asking for write access.
permissions:
  contents: read

jobs:
  dependency-review:
    permissions:
      contents: read
      # Required to read the pull request the review is about.
      pull-requests: read
    runs-on: ubuntu-latest
    name: Dependency Review
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The inputs below are this action's own. The previous set -- path, format and a
      # long `args` list of --disable-assembly, --enable-golang and friends -- were OWASP
      # Dependency-Check flags that this action does not define and silently ignored, so
      # the job had never actually been configured. It also never ran: `on: pull_request`
      # means it first executed on the repository's first pull request.
      #
      # It needs GitHub's Dependency graph enabled for the repository
      # (Settings -> Code security -> Dependency graph). Without it the action fails with
      # "Dependency review is not supported on this repository", which is a setting to
      # turn on, not a finding. It is left failing rather than made warn-only on purpose:
      # a security job that passes by doing nothing is the failure mode this file's own
      # govulncheck comment already refuses.
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  govulncheck:
    runs-on: ubuntu-latest
    name: Go Vulnerability Check

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Guard: check if Go module exists
      - name: Require a Go module
        # go.mod is required, not optional. Guarding this step on its
        # presence would let the vulnerability scan pass by doing nothing,
        # which is the failure mode a security check must never have.
        run: |
          if [ ! -f go.mod ]; then
            echo "::error::go.mod is missing; govulncheck cannot run and must not silently pass."
            exit 1
          fi
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'

      - name: Run govulncheck
        run: |
          # Pinned, but pinned to a version that understands the Go release this
          # module targets. v1.1.4 predates Go 1.27 and crashes while building the
          # SSA form rather than reporting anything, which reads as a vulnerability
          # finding when it is a tool incompatibility.
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck ./...

  gitleaks:
    runs-on: ubuntu-latest
    name: Secret Scanning

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # GITHUB_TOKEN is required for the pull_request event: without it the action
      # refuses to scan and exits non-zero before looking at a single byte, which reads
      # like a leaked secret and is not one. This only surfaced on the repository's first
      # pull request, because every earlier run was a push to main.
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    permissions:
      contents: read
      # Required to upload the analysis. Without it CodeQL scans successfully and then
      # fails at the last step with "Resource not accessible by integration", which
      # reads like a finding rather than a permissions problem.
      security-events: write
      actions: read
    runs-on: ubuntu-latest
    name: CodeQL

    strategy:
      fail-fast: false
      matrix:
        language: ['go', 'javascript']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          languages: ${{ matrix.language }}

      - uses: github/codeql-action/autobuild@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4

      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
