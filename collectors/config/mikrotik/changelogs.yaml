# =============================================================================
# Collector: MikroTik RouterOS changelog page
# =============================================================================
# Source registration: dataset/sources/mikrotik/changelogs.yaml, which ships
# enabled: false pending the ADR-0018 terms review. This config describes how
# the page would be read; it does not authorise reading it.
#
# Page structure, measured 2026-09-03 (46 entries, all of this shape):
#
#   <div class="flex items-center gap-4 py-3 changelog-header">
#     <i class="ti ti-chevron-down ..."></i>
#     <div class="grow"><div class="..."><div class="flex gap-4 items-center">
#       <span class="mtk-text-sm font-bold min-w-20"> 7.23.4 </span>
#       <div class="flex gap-1 text-[10px] font-bold text-white uppercase ...">
#         <div class="rounded-[4px] bg-green p-1"> Long-term </div>
#       </div>
#       ... 2026-09-03 ...
# =============================================================================

apiVersion: firmscout.dev/v1alpha1
kind: CollectorConfig

metadata:
  id: mikrotik.changelogs
  vendor: mikrotik
  version: 1

spec:
  engine: html_selectors

  product_match:
    product: mikrotik-routeros

  fetch:
    expected_content_type: text/html
    max_bytes: 2097152 # 2 MiB; the real page is ~409 KB
    timeout_seconds: 30
    # Measured: no ETag, and cache-control: private. A conditional request has
    # nothing to be conditional on, so change detection falls back to hashing
    # the normalised section below.
    conditional: none

  normalize:
    # Hash only the changelog entries. The rest of the ~409 KB page carries
    # framework-generated, per-request attributes; hashing it would report a
    # change on every single check.
    section_selector: "div.changelog-header"

    # NOTE on framework attributes: collector-config-spec.md §8.1's example also
    # lists "[wire\\:id]" and "[x-data]" here. This config deliberately does not.
    # `strip` removes *elements* matching a selector, and on this page the
    # Livewire/Alpine attributes sit on the wrappers that contain the changelog
    # entries -- stripping those selectors would delete the very entries being
    # extracted. Volatile attributes do not affect text extraction; suppressing
    # them for hashing purposes is the Normalizer's job, and the section
    # selector above already excludes the parts of the page that churn.
    strip:
      - script
      - style
      - noscript

  extract:
    release_container: "div.changelog-header"

    fields:
      version:
        # The entry's own version span. .First() inside each container, so the
        # bold text in the channel badge (a div, not a span) cannot be mistaken
        # for it.
        selector: "span.font-bold"
        transform: trim

      channel:
        # A constant, not a selector, and the reason is measured rather than
        # stylistic. Re-measured 2026-09-06 against the live page:
        #
        #   GET https://mikrotik.com/download/changelogs
        #     -> the embedded Livewire state carries channelFilter":"longTerm",
        #        and the server renders ONLY that channel's entries: 47 of them,
        #        every one badged "Long-term", with no Testing or Development
        #        badge anywhere on the page.
        #     -> no unfiltered view is reachable by a plain GET. ?channel=all
        #        returns the identical 413255-byte long-term page;
        #        ?channelFilter=all returns a 231990-byte page with no entries
        #        at all; /changelogs/all is a 302. The filter is Livewire state
        #        changed by an interaction, not a query parameter.
        #
        # So the honest channel for anything read here is a fact about WHICH
        # PAGE was fetched, not about a badge inside it: this endpoint is
        # MikroTik's long-term listing.
        #
        # Reading the badge instead was actively wrong, and this is the defect
        # that motivated the constant. Four entries -- 6.49.18, 6.49.19, 6.49.20
        # and 6.49.21 -- carry TWO badges, "Stable" and "Long-term", because
        # those releases are both the long-term line and the stable of the v6
        # line. "Stable" is rendered first, and the engine silently took the
        # first match, so four long-term releases were recorded as stable. They
        # then disagreed with upgrade.mikrotik.com/routeros/NEWESTa7.stable --
        # which reports the v7 line, as its own filename says -- and the
        # platform booked a multi-source conflict that never existed.
        #
        # WHAT THIS CONSTANT DOES NOT SURVIVE: if MikroTik changes the default
        # view to "All", this config would label testing and development builds
        # as long-term, silently. The guard is testdata/fixtures/mikrotik: the
        # committed fixture now includes a real dual-badge entry, so a change in
        # the page's structure breaks a test rather than the catalogue. Re-check
        # the filter state when that fixture is next refreshed.
        value: long_term

      release_date:
        # The date is plain text inside the entry with no class of its own, so
        # the regex reads it from the container's whole text.
        selector: ":scope"
        regex: "(\\d{4}-\\d{2}-\\d{2})"
        date_format: "2006-01-02"
        # exact_day is correct here and only here: the page genuinely publishes
        # full YYYY-MM-DD dates, matched exactly by the regex above. An entry
        # whose date does not match produces an unknown date, never a guess.
        precision: exact_day

    release_type: embedded_os

    evidence_excerpt: ":scope"

    confidence:
      # 0.9, not 1.0: a selector matching proves the page still looks the way it
      # did, not that the extracted fact is correct.
      base: 0.9
      missing_optional_penalty: 0.1

  schedule:
    check_frequency_seconds: 21600 # four times a day
    min_frequency_seconds: 3600
