# =============================================================================
# Source: MikroTik RouterOS changelog page
# =============================================================================
# Measured 2026-09-03:
#   GET https://mikrotik.com/download/changelogs
#     -> server-rendered HTML, roughly 409 KB
#     -> cache-control: private, and NO ETag
#     -> 46 changelog entries, each a div.changelog-header carrying a version,
#        a channel badge (Long-term | Stable | Testing | Development) and a
#        YYYY-MM-DD date.
#   GET https://mikrotik.com/robots.txt
#     -> "User-agent: *" with an empty "Disallow:", i.e. nothing is disallowed.
#
# Re-measured 2026-09-05 (18:26:58Z), against this source's own host:
#   GET https://mikrotik.com/robots.txt
#     -> HTTP 200, exactly three lines: "User-agent: *", an empty "Disallow:", and
#        "Sitemap: https://mikrotik.com/sitemap.xml". An empty Disallow permits every
#        path, so nothing here restricts /download/changelogs.
#   GET https://mikrotik.com/download/changelogs
#     -> HTTP 200, still "cache-control: private, must-revalidate" and still no ETag,
#        so the section-hash change signal below is still the only one available.
#
# Because the page serves no ETag and declares itself private, a conditional
# request cannot be used as the change signal. The cheap signal available is a
# hash over normalize.section_selector only -- hashing the whole 409 KB document
# would report a change on essentially every check, and the cost of that is paid
# on every source, forever.
#
# ------------------------------- ADR-0018 ------------------------------------
# This source ships with enabled: false and terms_review_status: pending because
# ADR-0018 requires a human to review the site's terms of use before any
# collection happens, and because this repository's own regression test
# (TestEverySourceShipsPendingTermsReview, internal/adapters/registry) refuses to
# let ANY source in the committed dataset be collectable by default -- cloning
# this public repository and running its documented Quick Start must never, on
# its own, cause a request against a manufacturer's live infrastructure.
# robots_policy_status is a mechanical, measured fact; terms_review_status is a
# human judgement, and what follows records one that has in fact been made, on a
# specific working copy, without changing what ships here.
#
# Measured 2026-09-05: MikroTik publishes no terms of use. /terms, /terms.html,
# /legal, /terms-of-use and /tos all return 404; the sitemap's only legal document
# is /privacy; that page's headings are "Privacy Policy" and "Processing of
# personal data by MikroTik" and it contains no occurrence of "crawl", "scrape",
# "automated", "robot", "reuse" or "redistribute". This page is also the one
# where the question has teeth: it is 409 KB of authored changelog prose, not a
# bare version pointer, so a committed decision would also have to settle
# whether MikroTik being a Latvian company puts the EU sui generis database
# right in play over it, and whether extracting version, channel and date from
# 46 entries is a substantial extraction or de minimis factual data. Neither
# question is resolved here.
#
# On 2026-09-05 the repository owner reviewed exactly this evidence and
# explicitly authorized a live collection run against it, in these words: "pode
# rodar o check-source contra a MikroTik". That authorization was applied to a
# local working database for one session's demonstration, not committed here --
# see the ADR-0018 note above for why those are different decisions.
# -----------------------------------------------------------------------------

apiVersion: firmscout.dev/v1alpha1
kind: Source

metadata:
  slug: changelogs
  vendor: mikrotik

spec:
  product: mikrotik-routeros
  source_type: html_page
  url: https://mikrotik.com/download/changelogs

  # Authority
  official: true
  quality_class: official_manufacturer

  # Compliance -- see the ADR-0018 note above.
  robots_policy_status: allowed
  robots_checked_at: 2026-09-05T18:26:58Z
  terms_review_status: pending
  terms_review_note: >-
    ADR-0018: a human must review MikroTik's terms of use before this source is
    collectable IN THE COMMITTED REGISTRY. Measured 2026-09-05:
    mikrotik.com/robots.txt is "User-agent: *" with an empty "Disallow:", which
    permits this path; and MikroTik publishes no terms of use anywhere (/terms,
    /terms.html, /legal, /terms-of-use and /tos are 404, and the only legal
    document in the sitemap is a personal-data privacy notice silent on
    automated access and on reuse of published content). No published terms is
    not the same as permission, so the committed judgement stays pending. A
    human review against exactly this evidence DID happen on 2026-09-05, and
    was applied to a local working database rather than to this file -- see the
    ADR-0018 note above for why those are different decisions.
  authentication_type: none

  # Not collected from until the terms review above is complete, in this
  # committed file. See the ADR-0018 note above.
  enabled: false
  health: pending_review

  # Collection
  collector_id: mikrotik.changelogs
  expected_content_type: text/html

  # Four checks a day. The vendor publishes a handful of releases a month; more
  # frequent polling would buy nothing and cost the vendor bandwidth.
  check_frequency_seconds: 21600
  min_frequency_seconds: 3600

  normalize:
    # Hash only the changelog entries. This is the single biggest cost lever on
    # this source: without it, every check reports a change.
    section_selector: "div.changelog-header"
    strip:
      - script
      - style
      - noscript
